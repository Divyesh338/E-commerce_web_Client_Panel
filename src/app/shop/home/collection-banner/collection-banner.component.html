<section class="pb-0 category-section">
    <div class="container">
        <div class="category-grid">
            <a class="category-item" *ngFor="let data of categories" [routerLink]="data.link">
                <img [src]="data.imagePath" alt="category image" />

                <div class="category-overlay">
                    <h4>Save {{ data.isSave }}%</h4>
                    <h2>{{ data.title }}</h2>
                </div>
            </a>
        </div>
    </div>
</section>
